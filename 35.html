<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 গ্রিনহাউস প্রিমিয়াম | সেরা গাছের ডিজিটাল মার্কেট</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gold-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --dark-gradient: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-neon: 0 0 30px rgba(102, 126, 234, 0.5);
            --shadow-glow: 0 25px 50px rgba(0,0,0,0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background: #0a0a0a;
            color: white;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
            z-index: -2;
            animation: bgShift 20s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 0;
            backdrop-filter: blur(30px);
            background: rgba(10, 10, 10, 0.9);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(250, 112, 154, 0.5);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); filter: hue-rotate(0deg); }
            50% { transform: scale(1.05); filter: hue-rotate(180deg); }
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-link {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding: 0.8rem 0;
            transition: all 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold-gradient);
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: white;
            transform: translateY(-2px);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Search & Controls */
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-container {
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 0.5rem 1rem;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .search-container:hover {
            box-shadow: var(--shadow-neon);
            transform: scale(1.02);
        }

        .search-input {
            background: none;
            border: none;
            color: white;
            padding: 0.7rem 1rem;
            width: 250px;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .btn-primary {
            background: var(--primary-gradient);
            box-shadow: var(--shadow-neon);
        }

        .btn-secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 800px;
            z-index: 2;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            animation: titleFloat 4s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .hero-subtitle {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .cta-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Filters */
        .filters-section {
            max-width: 1400px;
            margin: 5rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
        }

        .filters-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
        }

        .filter-btn {
            aspect-ratio: 1;
            border: 2px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
            transform: scale(1.1) translateY(-10px);
            box-shadow: var(--shadow-neon);
        }

        /* Products */
        .products-section {
            max-width: 1400px;
            margin: 5rem auto;
            padding: 0 2rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 3rem;
        }

        .product-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            height: 500px;
        }

        .product-card:hover {
            transform: translateY(-30px) rotateX(10deg) rotateY(5deg);
            box-shadow: var(--shadow-glow), 0 0 60px rgba(102, 126, 234, 0.3);
        }

        .product-image {
            height: 280px;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .product-card:hover .product-image img {
            transform: scale(1.2) rotate(5deg);
        }

        .product-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, rgba(102,126,234,0.8), rgba(118,75,162,0.8));
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .product-card:hover .product-overlay {
            opacity: 1;
        }

        .product-content {
            padding: 2rem;
            text-align: center;
        }

        .product-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .product-price {
            font-size: 2rem;
            font-weight: 900;
            background: var(--success-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .buy-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--gold-gradient);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(250, 112, 154, 0.4);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(60px);
            transition: all 1s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }
            
            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        /* Scroll Progress */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 4px;
            background: var(--gold-gradient);
            z-index: 1001;
            transition: width 0.1s ease;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 100px;
            right: -400px;
            background: var(--success-gradient);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-glow);
            z-index: 10000;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            backdrop-filter: blur(20px);
        }

        .toast.show {
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="scroll-progress"></div>
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="header">
        <nav class="nav-container">
            <div class="logo">🌿 গ্রিনহাউস</div>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-link">হোম</a></li>
                <li><a href="#explore" class="nav-link">এক্সপ্লোর</a></li>
                <li><a href="#indoor" class="nav-link">ইনডোর</a></li>
                <li><a href="#outdoor" class="nav-link">আউটডোর</a></li>
                <li><a href="#premium" class="nav-link">প্রিমিয়াম</a></li>
            </ul>
            <div class="controls">
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 গাছ খুঁজুন...">
                </div>
                <button class="btn btn-primary" onclick="searchPlants()">খুঁজুন</button>
                <button class="btn btn-secondary" id="modeToggle" onclick="toggleTheme()">🌙</button>
            </div>
        </nav>
    </header>

    <!-- Hero -->
    <section id="home" class="hero fade-in">
        <div class="hero-content">
            <h1 class="hero-title">সবুজ জীবনের শুরু</h1>
            <p class="hero-subtitle">৫০+ প্রিমিয়াম কালেকশন | ইনডোর আউটডোর ফুল ফল | নেক্সট জেনারেশন ডিজাইন</p>
            <div class="cta-buttons">
                <a href="#explore" class="btn btn-primary" style="padding: 1.5rem 3rem; font-size: 1.2rem;">শপিং শুরু করুন</a>
                <a href="#premium" class="btn btn-secondary" style="padding: 1.5rem 3rem; font-size: 1.2rem;">প্রিমিয়াম দেখুন</a>
            </div>
        </div>
    </section>

    <!-- Filters -->
    <section id="explore" class="filters-section">
        <h2 class="filters-title fade-in">ক্যাটাগরি ব্রাউজ করুন</h2>
        <div class="filter-grid">
            <button class="filter-btn active" data-filter="all">🌱 সব</button>
            <button class="filter-btn" data-filter="indoor">🏠 ইনডোর</button>
            <button class="filter-btn" data-filter="outdoor">🌳 আউটডোর</button>
            <button class="filter-btn" data-filter="flower">💐 ফুল</button>
            <button class="filter-btn" data-filter="fruit">🍊 ফল</button>
            <button class="filter-btn" data-filter="premium">⭐ প্রিমিয়াম</button>
        </div>
    </section>

    <!-- Products -->
    <section id="indoor" class="products-section">
        <div class="products-grid" id="productsGrid"></div>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Enhanced Plants Data with premium category
        const plantsData = [
            // ... (same 50 plants as before, but adding premium flag)
            {id:1, name:"মানে গাছ", price:850, category:"indoor", type:"indoor", premium:false, img:"https://images.unsplash.com/photo-1588920882070-4117909b73d3?w=400&h=300&fit=crop"},
            {id:2, name:"সানসেভিরিয়া গোল্ড", price:1250, category:"indoor", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1588166524941-4ff1a761af41?w=400&h=300&fit=crop"},
            // ... continue with all 50+ plants (keeping original data)
            // Adding 10 premium plants
            {id:51, name:"বনসাই মাস্টারপিস", price:8500, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1558618047-3c8c76fdd7f9?w=400&h=300&fit=crop"},
            {id:52, name:"ওরকিড কিং", price:4500, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1584520513592-6e0b529168e9?w=400&h=300&fit=crop"},
            {id:53, name:"মনস্টেরা ভারিয়েগেটেড", price:3500, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1612842197623-d577abd0b56c?w=400&h=300&fit=crop"},
            {id:54, name:"ফিলোডেনড্রন পিনক প্রিন্সেস", price:2800, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1609396369822-337f44a234e4?w=400&h=300&fit=crop"},
            {id:55, name:"অ্যালোকাসিয়া ড্রাগন স্কেল", price:4200, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1622473396778-466a8c37b9a7?w=400&h=300&fit=crop"},
            {id:56, name:"ক্যালাথিয়া প্রিন্সেস পিঙ্ক", price:2200, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1612842197623-d577abd0b56c?w=400&h=300&fit=crop"},
            {id:57, name:"ফিকাস অডিয়ান্ট ভারিয়েগেটেড", price:3800, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1583703520420-0c3571b8c89c?w=400&h=300&fit=crop"},
            {id:58, name:"অ্যানথুরিয়াম ক্রিসমাস", price:2900, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1608043152268-3525a095898f?w=400&h=300&fit=crop"},
            {id:59, name:"স্ট্রোমানথে ট্রায়স্টার", price:1800, category:"premium", type:"indoor", premium:true, img:"https://images.unsplash.com/photo-1586930434668-0b6e444556d2?w=400&h=300&fit=crop"},
            {id:60, name:"হুয়মোর্তিয়ানিয়া", price:6500, category:"premium", type:"outdoor", premium:true, img:"https://images.unsplash.com/photo-1571896349840-e26a1a146d59?w=400&h=300&fit=crop"}
        ].concat(/* your original 50 plants */);

        let currentFilter = 'all';
        let searchTerm = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', init);

        function init() {
            createParticles();
            renderPlants();
            setupEventListeners();
            setupScrollAnimations();
            updateScrollProgress();
        }

        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = (Math.random() * 8 + 4) + 'px';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        function renderPlants(plants = plantsData) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = plants.slice(0, 24).map(plant => `
                <div class="product-card fade-in" data-category="${plant.category}" data-premium="${plant.premium}">
                    <div class="product-image">
                        <img src="${plant.img}" alt="${plant.name}" loading="lazy">
                        ${plant.premium ? '<div class="product-badge">⭐ প্রিমিয়াম</div>' : ''}
                        <div class="product-overlay">
                            <div>🔍 বিস্তারিত দেখুন</div>
                        </div>
                    </div>
                    <div class="product-content">
                        <h3 class="product-title">${plant.name}</h3>
                        <div class="product-price">৳ ${plant.price.toLocaleString()}</div>
                        <button class="buy-btn" onclick="buyPlant(${plant.id}, '${plant.name}', ${plant.price})">
                            কিনুন এখন
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    filterPlants();
                });
            });

            // Search
            document.getElementById('searchInput').addEventListener('input', debounce(searchPlants, 300));
        }

        function filterPlants() {
            const filtered = plantsData.filter(plant => {
                const matchesFilter = currentFilter === 'all' || 
                    plant.category === currentFilter || 
                    (currentFilter === 'premium' && plant.premium);
                const matchesSearch = !searchTerm || plant.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesFilter && matchesSearch;
            });
            renderPlants(filtered);
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function buyPlant(id, name, price) {
            showToast(`🎉 ${name} সফলভাবে কার্টে যোগ হয়েছে! ৳${price}`);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function setupScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        }

        function updateScrollProgress() {
            window.addEventListener('scroll', () => {
                const scrolled = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
                document.querySelector('.scroll-progress').style.width = scrolled + '%';
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        function searchPlants() {
            searchTerm = document.getElementById('searchInput').value;
